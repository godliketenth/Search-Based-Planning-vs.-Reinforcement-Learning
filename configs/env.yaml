# Environment configuration, shared by every phase.
#
# Overridable from the command line; see `scripts/phase1_sanity.py --help`.

level: "1-1"              # "world-stage". 1-1 is the training/planning level.
seed: 0                   # seeds env reset and the sticky-action RNG.

# Sticky-action probability -- the two evaluation conditions of the experimental design.
#   0.00  deterministic: open-loop plans replay exactly. Upper bound.
#   0.25  stochastic: open-loop plans break, forcing closed-loop replanning.
sticky_p: 0.0

# Episode truncation, in *agent steps* (not emulated frames). The in-game 400 s timer is a
# separate, looser bound. ~2000 steps is comfortably enough to clear 1-1.
max_episode_steps: 2000

# "rgb_array" lets scripts capture frames for GIF/mp4 output. There is no headless fast
# path -- the PPU renders either way (Phase 0, Finding 2) -- so this costs nothing.
render_mode: "rgb_array"
